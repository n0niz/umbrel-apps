description: >-
  A reporting view for your Firefly III data. Pick several categories, tags,
  budgets or payees and see them month by month over several years, compare
  years against each other per month or cumulatively, and get yearly totals
  with the change against the previous year. Reads your data through a Firefly
  III personal access token, which stays on your server.
