manifestVersion: 1
id: n0niz-trends
name: Spending Trends
tagline: Editable money home page, StarMoney-style reports and your Kraken Bitcoin stack
icon: https://raw.githubusercontent.com/n0niz/umbrel-apps/master/n0niz-trends/icon.svg
category: finance
version: "2.21.9"
port: 4949
description: >-
  A reporting app for your Firefly III data. An editable home page with
  widgets you choose, resize and reorder; reports for income vs expenses,
  categories, budgets, tags, payees, net worth and account balances that you
  can filter, save by name and pin to the home page; a trends view that
  compares items across years; and a Bitcoin page that reads your BTC buys
  straight from a read-only Kraken API key, with cost basis, profit, return
  and the German one-year tax-free rule. Hardware wallets can be added watch-only
  (xpub, zpub or Sparrow descriptor, multisig too) and are read through your own
  Mempool app. A local AI agent (Ollama) sorts bookings your Firefly rules
  missed, learns from your own categories and tags, and writes a monthly news
  flash. Tokens and keys stay on your server.
developer: n0niz
website: https://github.com/n0niz/umbrel-apps
submitter: n0niz
submission: https://github.com/n0niz/umbrel-apps
repo: https://github.com/n0niz/umbrel-apps
support: https://github.com/n0niz/umbrel-apps/issues
gallery: []
releaseNotes: >-
  Latest transactions are in the same order as in Firefly (newest booking first
  within a day), the amount column comes right after the payee so it is always
  visible, and a description is only shown when it says more than the payee.
  Subscriptions overview: one booking linked to a Firefly subscription (e.g. a
  Google Play charge linked to Zattoo) no longer hides your other subscriptions
  from the same payee.
dependencies:
  - firefly-iii
path: ""
defaultUsername: ""
defaultPassword: ""
