manifestVersion: 1
id: n0niz-trends
name: Spending Trends
tagline: Compare Firefly III categories, tags and budgets across months and years
icon: https://raw.githubusercontent.com/n0niz/umbrel-apps/master/n0niz-trends/icon.svg
category: finance
version: "1.0.0"
