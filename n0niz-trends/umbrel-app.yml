manifestVersion: 1
id: n0niz-trends
name: Spending Trends
tagline: Editable money home page, StarMoney-style reports and your Kraken Bitcoin stack
icon: https://raw.githubusercontent.com/n0niz/umbrel-apps/master/n0niz-trends/icon.svg
category: finance
version: "2.0.1"
port: 4949
description: >-
  A reporting app for your Firefly III data. An editable home page with
  widgets you choose, resize and reorder; reports for income vs expenses,
  categories, budgets, tags, payees, net worth and account balances that you
  can filter, save by name and pin to the home page; a trends view that
  compares items across years; and a Bitcoin page that reads your BTC buys
  straight from a read-only Kraken API key, with cost basis, profit, return
  and the German one-year tax-free rule. Tokens and keys stay on your server.
developer: n0niz
website: https://github.com/n0niz/umbrel-apps
submitter: n0niz
submission: https://github.com/n0niz/umbrel-apps
repo: https://github.com/n0niz/umbrel-apps
support: https://github.com/n0niz/umbrel-apps/issues
gallery: []
releaseNotes: >-
  New editable Home page, saved reports, net worth, account balances and a
  Kraken Bitcoin page. Add your read-only Kraken key under Settings.
dependencies:
  - firefly-iii
path: ""
defaultUsername: ""
defaultPassword: ""
