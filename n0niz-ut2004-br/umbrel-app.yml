manifestVersion: 1
id: n0niz-ut2004-br
name: UT2004 Bombing Run
tagline: Unreal Tournament 2004 dedicated server, set up for Bombing Run
icon: https://raw.githubusercontent.com/n0niz/umbrel-apps/master/n0niz-ut2004-br/icon.png
category: gaming
version: "1.1.0"
port: 8777
description: >-
  A dedicated Unreal Tournament 2004 server (v3369, ECE Bonus Pack and Megapack;
  players on OldUnreal's 3374 patch can join) set up like the Fair-Gamers
  BombingRun Server #11: Bombing Run only, 16 slots, tick rate 41, map vote with
  a repeat limit of 1 and kick votes.


  Players join on UDP port 7777, for example over Tailscale at umbrel-1:7777.
  The server isn't listed publicly unless you set PUBLIC_LISTING to True and
  forward UDP 7777, 7778 and 7787 on your router.


  The tile opens a dashboard: live status, scoreboard by team, map change,
  bots, mutators, settings and restart. Kick, ban and chat are in the classic
  web admin, linked from the dashboard and logged in automatically.
  Custom maps and mutators go into Files → Apps → n0niz-ut2004-br →
  data/addons (Maps, System, ...).
developer: n0niz
website: https://github.com/n0niz/umbrel-apps
submitter: n0niz
submission: https://github.com/n0niz/umbrel-apps
repo: https://github.com/PhasecoreX/docker-ut2004-server
support: https://github.com/n0niz/umbrel-apps/issues
gallery: []
releaseNotes: >-
  New dashboard instead of the old web admin: live scoreboard by team with
  bots and ping, map change, bots, mutators and all settings, restart with one
  click. The classic web admin is still there for kick, ban and chat.
dependencies: []
path: ""
defaultUsername: "admin"
deterministicPassword: true
