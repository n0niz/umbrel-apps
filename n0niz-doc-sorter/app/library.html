<body>
<div class="app">
  <header>
    <h1>Doc Sorter <span>✦</span></h1>
    <div class="tabs"><button id="tTree">Tree</button><button id="tTime">Timeline</button><button id="tFold">Folders</button></div>
    <input id="search" placeholder="Search title, sender, type, folder…">
    <button class="hbtn" id="aipill" title="AI recognition running"></button>
    <a class="hbtn" href="/" title="Review queue of the sorting engine">Review queue</a>
    <a class="hbtn" href="/_setup">⚙</a>
  </header>
  <aside id="side"></aside>
  <main id="main"><div class="empty">Loading your documents…</div></main>
</div>
<nav id="years"></nav>
<div id="sel"><b id="selN"></b>
  <button id="sFolder">📁 Add to folder</button><button id="sType">🏷 Type</button><button id="sCorr">✉ From</button>
  <button class="ai" id="sAI">✨ Recognize</button><button id="sApply" style="display:none">✓ Apply suggestions</button><button id="sClear">✕</button></div>
<div id="drawer"></div>
<div id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
let M = { tags: [], types: [], corrs: [] }, DOCS = [], AI = { queue: [], results: {}, errors: {}, busy: null };
let DRAGF = null, UNF_N = 60, VIEW = (() => { try { return localStorage.getItem("docsorter.view") || "tree"; } catch (e) { return "tree"; } })(), FS = {}, PROPS = null, HIDEPROP = new Set(), OPEN = null, F = { kind: "all", id: null }, Q = "", SEL = new Set(), lastClick = null, showAllCorr = false, DRAG = null;
const byId = (arr, id) => arr.find((x) => x.id === id);
const tagName = (id) => (byId(M.tags, id) || {}).name || "?";

async function api(path, body, method) {
  const r = await fetch(path, body === undefined ? {} : { method: method || "POST", body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
function toast(t, ms = 2600) { const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(e._t); e._t = setTimeout(() => (e.style.display = "none"), ms); }

async function loadAll() {
  try {
    const [m, d, a] = await Promise.all([api("/_lib/api/meta"), api("/_lib/api/docs"), api("/_lib/api/ai")]);
    M = m; DOCS = d.docs; AI = a;
    render();
  } catch (e) { $("#main").innerHTML = `<div class="empty">${esc(e.message)}<br><br><a href="/_setup">Open setup</a></div>`; }
}
async function reloadDocs() { const [m, d] = await Promise.all([api("/_lib/api/meta"), api("/_lib/api/docs")]); M = m; DOCS = d.docs; render(); }

// ---------------------------------------------------------------- sidebar
const visibleTags = () => M.tags.filter((t) => !t.system);
function tagTree() {
  const tags = visibleTags(), kids = {};
  tags.forEach((t) => (kids[t.parent || 0] = kids[t.parent || 0] || []).push(t));
  Object.values(kids).forEach((l) => l.sort((a, b) => a.name.localeCompare(b.name)));
  const out = [], walk = (p, depth) => (kids[p] || []).forEach((t) => { out.push([t, depth]); walk(t.id, depth + 1); });
  walk(0, 0);
  const seen = new Set(out.map(([t]) => t.id));
  tags.filter((t) => !seen.has(t.id)).forEach((t) => out.push([t, 0]));
  return out;
}
function nav(kind, id, label, n, extra = "") {
  const on = F.kind === kind && F.id === id ? " on" : "";
  return `<div class="nav${on}" data-k="${kind}" data-id="${id ?? ""}" ${extra}>${label}<span class="n">${n ?? ""}</span></div>`;
}

function docText(d) {

}
function descendants(id) { const out = new Set([id]); let grew = true; while (grew) { grew = false; M.tags.forEach((t) => { if (t.parent && out.has(t.parent) && !out.has(t.id)) { out.add(t.id); grew = true; } }); } return out; }
function filtered() {
  let L = DOCS;
  if (F.kind === "unsorted") L = L.filter((d) => !d.document_type);
  if (F.kind === "ai") L = L.filter((d) => AI.results[d.id] || AI.errors[d.id] || AI.queue.includes(d.id) || AI.busy === d.id);
  if (F.kind === "type") L = L.filter((d) => d.document_type === F.id);

  return L;
}
function title() {

}
function card(d) {

  bindCards($("#cand"));
  const b = $("#candAll"), good = L.filter((d) => d.score >= 0.5);
  if (good.length) { b.style.display = ""; b.textContent = `+ Add ${good.length} best matches`; b.onclick = () => dropOn("tag", tid, good.map((d) => d.id)); }
}

// ---------------------------------------------------------------- belongs together (drawer)
async function loadRelated(id, getTags) {
  let r;
  try { r = await api(`/_lib/api/related/${id}`); } catch (e) { $("#dRel").textContent = e.message; return; }
  if (OPEN !== id) return;
  const doc = (x) => DOCS.find((d) => d.id === x) || { id: x, title: "#" + x };
  const row = (d, btns) => `<div class="rel"><img src="/_lib/thumb/${d.id}" data-open="${d.id}" alt=""><div class="tt"><b>${esc(d.title)}</b><small>${esc((d.created || "").split("-").reverse().join("."))}${d.document_type ? " · " + esc((byId(M.types, d.document_type) || {}).name || "") : ""}${(d.tags || []).filter(isFolder).length ? " · 📁 " + esc((d.tags || []).filter(isFolder).map(tagName).join(", ")) : ""}</small></div>${btns}</div>`;
  $("#dLinks").innerHTML = r.links.length ? r.links.map((x) => row(doc(x), `<button data-unlink="${x}" title="Remove link">✕</button>`)).join("") : `<p style="color:var(--mut);font-size:12px;margin:4px 0">Nothing linked yet – use 🔗 below.</p>`;
  const rel = r.related.filter((x) => !r.links.includes(x.id)).map((x) => DOCS.find((d) => d.id === x.id) || x);
  $("#dRel").innerHTML = rel.length ? rel.map((d) => row(d, `<button data-link="${d.id}" title="Connect these two documents">🔗 Link</button><button data-tog="${d.id}" title="Put both into the same folder">📁 Together</button>`)).join("") : `<p style="color:var(--mut);font-size:12px">No similar documents found.</p>`;
  $$("[data-open]", $("#drawer")).forEach((im) => (im.onclick = () => openDoc(+im.dataset.open)));
  $$("[data-link]", $("#drawer")).forEach((b) => (b.onclick = async () => { b.disabled = true; try { await api("/_lib/api/link", { a: id, b: +b.dataset.link }); toast("🔗 Linked – shows up in Paperless as “Gehört zu”"); loadRelated(id); } catch (e) { toast(e.message, 5000); } }));
  $$("[data-unlink]", $("#drawer")).forEach((b) => (b.onclick = async () => { try { await api("/_lib/api/link", { a: id, b: +b.dataset.unlink, on: false }); loadRelated(id); } catch (e) { toast(e.message, 5000); } }));
  $$("[data-tog]", $("#drawer")).forEach((b) => (b.onclick = async () => {
    const other = DOCS.find((d) => d.id === +b.dataset.tog), me = DOCS.find((d) => d.id === id);
    const mine = (me.tags || []).filter(isFolder), theirs = (other.tags || []).filter(isFolder);
    try {
      if (mine.length) await dropOn("tag", mine[0], [other.id]);
      else if (theirs.length) await dropOn("tag", theirs[0], [id]);
      else {
        const corr = (byId(M.corrs, me.correspondent) || {}).name;
        const name = prompt("Neither is in a folder yet. Name for a new folder:", corr || me.title);
        if (!name || !name.trim()) return;
        const t = await api("/_lib/api/create/tag", { name: name.trim() });
        await api("/_lib/api/bulk", { ids: [id, other.id], add_tags: [t.id] }); toast(`📁 “${name.trim()}” created with both documents`); await reloadDocs();
      }
      openDoc(id);
    } catch (e) { toast(e.message, 5000); }
  }));
}

// ---------------------------------------------------------------- selection
function toggleSel(id, range) {
  if (range && lastClick !== null) {
    const a = ORDER.indexOf(lastClick), b = ORDER.indexOf(id);
    ORDER.slice(Math.min(a, b), Math.max(a, b) + 1).forEach((i) => SEL.add(i));
  } else SEL.has(id) ? SEL.delete(id) : SEL.add(id);
  lastClick = id; refreshSel();
}
function refreshSel() {
  $$(".card").forEach((el) => { const on = SEL.has(+el.dataset.id); el.classList.toggle("sel", on); $(".ck", el).textContent = on ? "✓" : ""; });
  document.body.classList.toggle("selecting", SEL.size > 0);
  $("#sel").style.display = SEL.size ? "flex" : "none";
  $("#selN").textContent = SEL.size + " selected";
  const withS = [...SEL].filter((i) => AI.results[i]).length;
  $("#sApply").style.display = withS ? "" : "none"; $("#sApply").textContent = `✓ Apply ${withS} suggestion${withS > 1 ? "s" : ""}`;
}
$("#sClear").onclick = () => { SEL.clear(); refreshSel(); };
$("#sAI").onclick = () => recognize([...SEL]);
$("#sApply").onclick = () => applyMany([...SEL].filter((i) => AI.results[i]));
$("#sFolder").onclick = (e) => pickMenu(e.target, "tag", (id) => dropOn("tag", id, [...SEL]));
$("#sType").onclick = (e) => pickMenu(e.target, "type", (id) => dropOn("type", id, [...SEL]));
$("#sCorr").onclick = (e) => pickMenu(e.target, "corr", (id) => dropOn("corr", id, [...SEL]));

async function dropOn(kind, id, ids) {
  ids = ids || DRAG || []; DRAG = null;
  if (!ids.length) return;
  const body = { ids };
  if (kind === "tag") body.add_tags = [id];
  if (kind === "type") body.document_type = id;
  if (kind === "corr") body.correspondent = id;
  try {
    await api("/_lib/api/bulk", body);
    const name = kind === "tag" ? tagName(id) : (byId(kind === "type" ? M.types : M.corrs, id) || {}).name;
    toast(`${ids.length} document${ids.length > 1 ? "s" : ""} → ${name}`);
    SEL.clear(); await reloadDocs();
  } catch (e) { toast(e.message, 5000); }
}

// menu with search + "create"
function pickMenu(anchor, kind, cb) {
  $$(".menu").forEach((m) => m.remove());
  const items = kind === "tag" ? tagTree().map(([t, d]) => ({ id: t.id, name: " ".repeat(d * 3) + t.name, raw: t.name })) : (kind === "type" ? M.types : M.corrs).map((x) => ({ id: x.id, name: x.name, raw: x.name }));
  const m = document.createElement("div"); m.className = "menu";
  m.innerHTML = `<input placeholder="Search or create…"><div class="list"></div>`;
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  m.style.left = Math.min(r.left, innerWidth - 270) + "px";
  m.style.top = (r.top > 380 ? r.top - Math.min(370, 60 + items.length * 32) : r.bottom + 6) + "px";
  const inp = $("input", m), list = $(".list", m);
  const draw = () => {
    const q = inp.value.trim().toLowerCase();
    const L = items.filter((i) => i.raw.toLowerCase().includes(q));
    list.innerHTML = L.map((i, n) => `<div class="it${n === 0 && q ? " hl" : ""}" data-id="${i.id}">${esc(i.name)}</div>`).join("")
      + (q && !items.some((i) => i.raw.toLowerCase() === q) ? `<div class="it new" data-new="1">+ Create “${esc(inp.value.trim())}”</div>` : "");
    $$(".it", list).forEach((el) => (el.onclick = () => choose(el)));
  };
  const choose = async (el) => {
    m.remove();
    if (el.dataset.new) {
      try { const c = await api(`/_lib/api/create/${kind}`, { name: inp.value.trim() }); await reloadDocs(); cb(c.id); } catch (e) { toast(e.message, 5000); }
    } else cb(+el.dataset.id);
  };
  inp.oninput = draw;
  inp.onkeydown = (e) => { if (e.key === "Enter") { const el = $(".it.hl", list) || $(".it", list); if (el) choose(el); } if (e.key === "Escape") m.remove(); };
  draw(); inp.focus();
  setTimeout(() => document.addEventListener("mousedown", function off(e) { if (!m.contains(e.target)) { m.remove(); document.removeEventListener("mousedown", off); } }), 0);
}

// ---------------------------------------------------------------- AI
async function recognize(ids) {
  if (!ids.length) return;
  AI = await api("/_lib/api/ai", { ids });
  toast(`✨ ${ids.length} document${ids.length > 1 ? "s" : ""} queued for AI recognition`);
  SEL.clear(); render();
}
function suggestionBody(s, fields) { return { suggestion: s, fields }; }
async function applyOne(id, fields) {
  try {
    await api(`/_lib/api/ai/apply/${id}`, suggestionBody(AI.results[id], fields));
    delete AI.results[id]; toast("Applied"); await reloadDocs(); if ($("#drawer").classList.contains("open")) openDoc(id);
  } catch (e) { toast(e.message, 6000); }
}
async function applyMany(ids) {
  let ok = 0;
  for (const id of ids) {
    try { await api(`/_lib/api/ai/apply/${id}`, suggestionBody(AI.results[id])); delete AI.results[id]; ok++; toast(`Applying… ${ok}/${ids.length}`, 10000); } catch (e) { toast(`#${id}: ${e.message}`, 5000); }
  }
  toast(`✓ ${ok} document${ok === 1 ? "" : "s"} sorted`); SEL.clear(); await reloadDocs();
}
let aiTimer = null, lastAI = "";
async function pollAI() {
  try {
    const a = await api("/_lib/api/ai"), sig = JSON.stringify([a.queue, a.busy, Object.keys(a.results).length, Object.keys(a.errors).length]);
    AI = a;
    if (sig !== lastAI) {
      const wasWaiting = OPEN && !AI.results[OPEN];
      lastAI = sig; renderSide(); renderMain(); refreshSel();
      if (wasWaiting && (a.results[OPEN] || a.errors[OPEN])) openDoc(OPEN);
    }
  } catch (e) { /* ignore */ }
  refreshAI();
}
function refreshAI() {
  const n = AI.queue.length + (AI.busy ? 1 : 0), p = $("#aipill");
  p.style.display = n ? "" : "none"; p.textContent = `✨ ${n} in AI queue`;
  p.onclick = () => { F = { kind: "ai", id: null }; render(); };
  clearTimeout(aiTimer); aiTimer = setTimeout(pollAI, n ? 2500 : 15000);
}

// ---------------------------------------------------------------- detail drawer
async function openDoc(id) {
  OPEN = id;
  const D = $("#drawer"); D.classList.add("open");
  D.innerHTML = `<div class="top"><b>Loading…</b><button class="x" id="dx">×</button></div>`;
  $("#dx").onclick = closeDoc;
  let d;
  try { d = await api(`/_lib/api/doc/${id}`); } catch (e) { D.innerHTML += `<p style="padding:14px">${esc(e.message)}</p>`; return; }
  const s = AI.results[id];
  const opt = (arr, cur) => `<option value="">–</option>` + arr.slice().sort((a, b) => a.name.localeCompare(b.name)).map((x) => `<option value="${x.id}" ${x.id === cur ? "selected" : ""}>${esc(x.name)}</option>`).join("");
  const tagsHtml = (ids) => ids.map((t) => `<span class="chip">${esc(tagName(t))}<button data-rm="${t}">×</button></span>`).join("") + `<button class="chip" id="addTag">+ folder</button>`;
  let tags = [...(d.tags || [])];
  const sugg = s ? `<div class="sugg"><h4>✨ AI suggestion <small>(${s.secs}s)</small></h4>
      ${s.title ? `<label><input type="checkbox" data-f="title" checked><span>Title: <b>${esc(s.title)}</b></span></label>` : ""}
      ${s.type ? `<label><input type="checkbox" data-f="type" checked><span>Type: <b>${esc(s.type.name)}</b>${s.type.id ? "" : ' <span class="new">new</span>'}</span></label>` : ""}
      ${s.folders && s.folders.length ? `<label><input type="checkbox" data-f="folders" checked><span>Folders: <b>${s.folders.map((f) => esc(f.name) + (f.id ? "" : ' <span class="new">new</span>')).join(", ")}</b></span></label>` : ""}
      ${s.corr ? `<label><input type="checkbox" data-f="corr" checked><span>From: <b>${esc(s.corr.name)}</b>${s.corr.id ? "" : ' <span class="new">new</span>'}</span></label>` : ""}
      ${s.date ? `<label><input type="checkbox" data-f="date" checked><span>Date: <b>${esc(s.date.split("-").reverse().join("."))}</b></span></label>` : ""}
      <div style="display:flex;gap:8px;margin-top:8px"><button class="btn ai" id="dApply">✓ Apply ticked</button><button class="btn sec" id="dDrop">Discard</button></div></div>`
    : AI.errors[id] ? `<div class="sugg"><h4>✨ AI failed</h4><small>${esc(AI.errors[id])}</small></div>` : "";
  D.innerHTML = `<div class="top"><b title="${esc(d.title)}">${esc(d.title)}</b>
      <a class="hbtn" target="_blank" href="${esc((M.paperless || "") + "/documents/" + id + "/details")}">Paperless ↗</a><button class="x" id="dx">×</button></div>
    <iframe src="/_lib/preview/${id}" title="preview"></iframe>
    <div class="body">
      ${sugg}
      <label>Title</label><input id="fTitle" value="${esc(d.title)}">
      <div class="row2"><div><label>Date</label><input type="date" id="fDate" value="${esc((d.created || "").slice(0, 10))}"></div>
        <div><label>Type</label><select id="fType">${opt(M.types, d.document_type)}</select></div></div>
      <label>From</label><select id="fCorr">${opt(M.corrs, d.correspondent)}</select>
      <label>Folders</label><div class="tags" id="fTags">${tagsHtml(tags)}</div>
      <h5>🔗 Belongs together</h5><div id="dLinks"><p style="color:var(--mut);font-size:12px">…</p></div>
      <h5>Similar documents</h5><div id="dRel"><p style="color:var(--mut);font-size:12px">Looking…</p></div>
      <div style="display:flex;gap:8px;margin-top:16px"><button class="btn" id="dSave">Save</button>
        ${s ? "" : `<button class="btn ai" id="dAI">${AI.queue.includes(id) || AI.busy === id ? "✨ AI is reading…" : "✨ Recognize with AI"}</button>`}</div>
      <p style="color:var(--mut);font-size:12px">${esc(d.original_file_name || "")}${d.page_count ? " · " + d.page_count + " pages" : ""}</p>
    </div>`;
  $("#dx").onclick = closeDoc;
  loadRelated(id);
  const bindTags = () => {
    $$("[data-rm]", D).forEach((b) => (b.onclick = () => { tags = tags.filter((t) => t !== +b.dataset.rm); $("#fTags").innerHTML = tagsHtml(tags); bindTags(); }));
    $("#addTag").onclick = (e) => pickMenu(e.target, "tag", (tid) => { if (!tags.includes(tid)) tags.push(tid); $("#fTags").innerHTML = tagsHtml(tags); bindTags(); });
  };
  bindTags();
  $("#dSave").onclick = async () => {
    try {
      await api(`/_lib/api/doc/${id}`, { title: $("#fTitle").value, created: $("#fDate").value || undefined, document_type: +$("#fType").value || null, correspondent: +$("#fCorr").value || null, tags }, "PATCH");
      toast("Saved"); await reloadDocs();
    } catch (e) { toast(e.message, 5000); }
  };
  if ($("#dAI")) $("#dAI").onclick = async () => { await recognize([id]); openDoc(id); };
  if ($("#dApply")) $("#dApply").onclick = () => applyOne(id, $$("[data-f]:checked", D).map((c) => c.dataset.f));
  if ($("#dDrop")) $("#dDrop").onclick = async () => { AI = await api("/_lib/api/ai/clear", { ids: [id] }); render(); openDoc(id); };
}
function closeDoc() { OPEN = null; $("#drawer").classList.remove("open"); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if ($("#drawer").classList.contains("open")) closeDoc(); else { SEL.clear(); refreshSel(); $$(".tmulti").forEach((x) => x.classList.remove("tmulti")); } } });
let qT; $("#search").oninput = (e) => { clearTimeout(qT); qT = setTimeout(() => { Q = e.target.value.trim(); if (VIEW === "tree") window.renderTree(); else if (VIEW === "fold") renderFolders(); else renderMain(); refreshSel(); }, 150); };
loadAll();
</script>
<script src="/library/tree.js"></script>
<script>if (DOCS.length && VIEW === "tree") render();</script>
</body>
