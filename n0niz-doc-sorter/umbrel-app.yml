manifestVersion: 1
id: n0niz-doc-sorter
name: Doc Sorter
tagline: AI suggestions for your Paperless documents – you confirm
icon: https://raw.githubusercontent.com/n0niz/umbrel-apps/master/n0niz-doc-sorter/icon.svg
category: files
version: "1.6.0"
port: 4951
description: >-
  Sorts your Paperless-ngx documents with a local AI model from the Ollama app.
  New documents land in a review queue: for each one you get a suggested title,
  tags, correspondent, document type and date, tick what fits, change the rest
  and apply it to Paperless. Can also sort automatically, re-read bad scans with
  a vision model, and every change can be undone. A setup page connects
  Paperless and Ollama, downloads a model and creates the Paperless workflow
  for you. Nothing leaves your Umbrel.


  The sorting engine is paperless-gpt by icereed (MIT license).
developer: n0niz
website: https://github.com/n0niz/umbrel-apps
submitter: n0niz
submission: https://github.com/n0niz/umbrel-apps
repo: https://github.com/n0niz/umbrel-apps
support: https://github.com/n0niz/umbrel-apps/issues
gallery: []
releaseNotes: >-
  New look in the style of umbrelOS: frosted-glass panels over a soft colour
  background, Inter font, pill buttons and inputs, a sliding Tree/Timeline/Folders
  switch, the document view opens as a sheet that rises and sinks like Umbrel's,
  menus and toasts pop in, tree rows fade in one after another, thumbnails fade
  in once loaded. Respects "reduce motion" and "reduce transparency".
dependencies:
  - paperless
  - ollama
path: "/library"
defaultUsername: ""
defaultPassword: ""
