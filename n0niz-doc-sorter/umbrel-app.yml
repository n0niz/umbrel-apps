manifestVersion: 1
id: n0niz-doc-sorter
name: Doc Sorter
tagline: AI suggestions for your Paperless documents – you confirm
icon: https://raw.githubusercontent.com/n0niz/umbrel-apps/master/n0niz-doc-sorter/icon.svg
category: files
version: "1.7.0"
port: 4951
description: >-
  Sorts your Paperless-ngx documents with a local AI model from the Ollama app.
  New documents land in a review queue: for each one you get a suggested title,
  tags, correspondent, document type and date, tick what fits, change the rest
  and apply it to Paperless. Can also sort automatically, re-read bad scans with
  a vision model, and every change can be undone. A setup page connects
  Paperless and Ollama, downloads a model and creates the Paperless workflow
  for you. Nothing leaves your Umbrel.


  The sorting engine is paperless-gpt by icereed (MIT license).
developer: n0niz
website: https://github.com/n0niz/umbrel-apps
submitter: n0niz
submission: https://github.com/n0niz/umbrel-apps
repo: https://github.com/n0niz/umbrel-apps
support: https://github.com/n0niz/umbrel-apps/issues
gallery: []
releaseNotes: >-
  The Tree is now a zoomable node graph: glass cards on an infinite canvas,
  Archive > folders > case files > documents with curved connectors and dashed
  "connected" lines between documents that belong together. Scroll or pinch to
  zoom, drag the background to pan, double-click a folder to zoom into it
  (breadcrumb to zoom back out), drag a document onto another to connect them,
  onto a folder to move it, folders onto folders to nest them – with a live
  preview line, auto-scroll at the edges and undo. The list tree is still there
  ("List"). New tabs: Tags (tag cloud, manage tags, drop documents onto a tag)
  and Category (document types as tiles with sums and deadlines, drop documents
  onto a category).
dependencies:
  - paperless
  - ollama
path: "/library"
defaultUsername: ""
defaultPassword: ""
