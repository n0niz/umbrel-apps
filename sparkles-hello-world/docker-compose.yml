version: "3.7"

services:
  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: n0niz-comfyui_server_1
      APP_PORT: 8188

  server:
    image: yanwk/comfyui-boot:cpu
    restart: on-failure
    init: true
    environment:
      CLI_ARGS: "--cpu"
    volumes:
      - /home/umbrel/comfyui/storage:/root
