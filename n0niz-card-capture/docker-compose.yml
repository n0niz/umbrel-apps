version: "3.7"

services:
  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: n0niz-card-capture_server_1
      APP_PORT: 8080
      # the phone posts notifications here without an Umbrel login;
      # the endpoint is protected by the secret key in its URL instead
      PROXY_AUTH_WHITELIST: "/api/hook*"

  server:
    image: python:3.12-alpine
    restart: on-failure
    init: true
    command: ["python", "-u", "/app/server.py"]
    environment:
      DATA_DIR: /data
      TZ: Europe/Berlin
      FIREFLY_URL: http://firefly-iii_server_1:8080
    volumes:
      - ${APP_DATA_DIR}/app:/app:ro
      - ${APP_DATA_DIR}/data:/data
