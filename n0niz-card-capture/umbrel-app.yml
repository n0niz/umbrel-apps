manifestVersion: 1
id: n0niz-card-capture
name: Card Capture
tagline: Turn card payment notifications into Firefly III transactions
icon: https://raw.githubusercontent.com/n0niz/umbrel-apps/master/n0niz-card-capture/icon.svg
category: finance
version: "1.1.0"
port: 4950
description: >-
  Receives card payment notifications forwarded from an Android phone (for
  example with MacroDroid), reads amount and merchant, and books them into
  Firefly III as transactions of a dedicated card account. Notifications that
  can't be booked safely, such as foreign-currency payments, wait for review in
  the web interface. Includes a step-by-step setup guide.
developer: n0niz
website: https://github.com/n0niz/umbrel-apps
submitter: n0niz
submission: https://github.com/n0niz/umbrel-apps
repo: https://github.com/n0niz/umbrel-apps
support: https://github.com/n0niz/umbrel-apps/issues
gallery: []
releaseNotes: >-
  Several cards: Krak, Amex, a partner's Visa and more, each with its own address
  for MacroDroid and its own Firefly account. Your existing Krak address keeps working.
dependencies:
  - firefly-iii
path: ""
defaultUsername: ""
defaultPassword: ""
